<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파이퍼 설교 연구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: 강단 원고대 — 왼쪽 공정 레일 · 가운데 따라 쓰는 작업면 · 오른쪽 코치/AI 연구실/연구 노트 */
:root{
  --paper:#EEF1F5; --sheet:#FFFFFF; --ink:#17202C; --muted:#5A6577; --rule:#D6DCE5;
  --accent:#23408E; --accent-ink:#FFFFFF; --accent-soft:#E2E8F7;
  --ai:#5B3FA6; --ai-soft:#ECE6F8; --ai-ink:#FFFFFF;
  --mark:#F6DA4C; --mark-ink:#3A3000;
  --ok:#24724A; --ok-soft:#DFF1E6; --warn:#9A6410; --warn-soft:#FBEFD6; --bad:#A83434; --bad-soft:#F7E1E1;
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F131A; --sheet:#171D27; --ink:#E4E9F0; --muted:#97A2B3; --rule:#2A3342;
  --accent:#93ABF2; --accent-ink:#0F1730; --accent-soft:#1F2A47;
  --ai:#B7A2EE; --ai-soft:#2A2244; --ai-ink:#17102C;
  --mark:#C8A928; --mark-ink:#1A1600;
  --ok:#62C792; --ok-soft:#173326; --warn:#E3B15A; --warn-soft:#3A2D14; --bad:#E58383; --bad-soft:#3D1D1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F131A; --sheet:#171D27; --ink:#E4E9F0; --muted:#97A2B3; --rule:#2A3342;
  --accent:#93ABF2; --accent-ink:#0F1730; --accent-soft:#1F2A47;
  --ai:#B7A2EE; --ai-soft:#2A2244; --ai-ink:#17102C;
  --mark:#C8A928; --mark-ink:#1A1600;
  --ok:#62C792; --ok-soft:#173326; --warn:#E3B15A; --warn-soft:#3A2D14; --bad:#E58383; --bad-soft:#3D1D1D; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select.proj{max-width:220px;padding:7px 8px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.aib{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--accent)}
.credit{flex-basis:100%;text-align:right;font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.01em;margin-top:-2px}
.credit a{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:3px 12px;margin-right:6px;font-size:13px}
.credit a:hover{background:var(--accent);color:var(--accent-ink)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 360px;gap:20px;margin-top:18px;align-items:start}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:2px}
.phase{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:12px 0 4px 8px;font-weight:600}
.phase:first-child{margin-top:0}
.step{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:var(--r);cursor:pointer;color:var(--ink)}
.step:hover{background:var(--sheet)}
.step.on{background:var(--sheet);box-shadow:inset 3px 0 0 var(--accent)}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;border:1.5px solid var(--rule);color:var(--muted);background:var(--paper)}
.dot.half{border-color:var(--warn);color:var(--warn)}
.dot.full{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.step span.t{font-size:14px;line-height:1.3}
.progress{margin:14px 8px 0;font-size:12px;color:var(--muted)}
.meter{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
main.work{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:26px 28px 30px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.04em}
.work h2{font-family:var(--f-display);font-size:28px;line-height:1.25;margin:4px 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 14px;max-width:62ch}
.todo{display:flex;flex-wrap:wrap;gap:8px 18px;background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin:0 0 18px;font-size:14px}
.todo b{font-weight:600;margin-right:4px}
.todo ol{margin:0;padding-left:18px;display:flex;flex-wrap:wrap;gap:4px 22px}
.welcome{border:1px dashed var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.welcome h3{margin:0 0 6px;font-size:15px}
.welcome ol{margin:0;padding-left:20px;font-size:14px}
.welcome li{margin-bottom:3px}
.passage{font-family:var(--f-display);font-size:17px;line-height:1.8;background:var(--paper);border-radius:var(--r);padding:12px 16px;margin:0 0 20px}
.passage b{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500;display:block;margin-bottom:2px}
.fields{display:flex;flex-direction:column;gap:22px}
.field label.l,.field .l{display:block;font-weight:600;font-size:14.5px;margin-bottom:2px}
.field .h{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);padding:9px 11px;line-height:1.6}
.field textarea{resize:vertical;min-height:70px}
.field textarea.ms{font-family:var(--f-display);font-size:16px;line-height:1.85}
.guide{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.how{font-size:13px;color:var(--ink);background:var(--paper);border-radius:6px;padding:6px 10px}
.how b{color:var(--accent);font-weight:600;margin-right:4px}
details.ex{border-left:3px solid var(--mark);padding:2px 0 2px 10px}
details.ex summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary::before{content:"▸";font-size:11px}
details.ex[open] summary::before{content:"▾"}
.exbox{font-family:var(--f-display);font-size:14.5px;line-height:1.75;white-space:pre-wrap;margin:6px 0 4px;color:var(--ink)}
.exacts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.airow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.aichip{border:1px solid var(--ai);color:var(--ai);background:var(--ai-soft);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.aichip:hover{background:var(--ai);color:var(--ai-ink)}
.noai{font-size:12.5px;color:var(--muted);font-style:normal}
.cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.cnt.over{color:var(--warn)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.checks input{margin-top:5px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-size:13px;background:var(--sheet);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--sheet);text-align:left}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card strong{display:block;font-size:15px;margin-bottom:2px}
.card span{font-size:13px;color:var(--muted)}
.checkbox-results{display:flex;flex-direction:column;gap:6px;margin-top:22px;border-top:1px dashed var(--rule);padding-top:14px}
.res{display:flex;gap:8px;font-size:14px;align-items:flex-start}
.pill{flex:none;font-family:var(--f-mono);font-size:11px;border-radius:999px;padding:1px 8px;margin-top:2px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.nav-foot{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.move{display:grid;grid-template-columns:30px 1fr;gap:10px}
.move .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);padding-top:3px}
.alloc{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:-6px 0 14px}
.alloc b{color:var(--ink);font-weight:500}
.matrix-wrap{overflow-x:auto}
table.mx{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
table.mx th,table.mx td{border:1px solid var(--rule);padding:6px;vertical-align:top}
table.mx th{background:var(--paper);font-weight:600;text-align:left}
table.mx textarea{width:100%;min-height:54px;border:0;background:transparent;resize:vertical;font-size:13px;line-height:1.5}
table.mx td.filled{background:var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.stat{border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px}
.rub{display:flex;flex-direction:column;gap:12px}
.rub-item{border:1px solid var(--rule);border-radius:8px;padding:10px 14px}
.rub-item .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rub-item .hd strong{font-size:14px}
.scale{display:flex;gap:4px}
.scale button{width:32px;height:30px;border:1px solid var(--rule);background:var(--sheet);border-radius:5px;cursor:pointer;font-family:var(--f-mono)}
.scale button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rub-item .desc{font-size:12.5px;color:var(--muted);margin-top:6px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.total{display:flex;align-items:center;gap:14px;margin:16px 0;padding:12px 16px;border-radius:8px;background:var(--paper);flex-wrap:wrap}
.total .v{font-family:var(--f-mono);font-size:28px}
.manuscript{font-family:var(--f-display);font-size:17px;line-height:1.95;white-space:pre-wrap;background:var(--paper);border-radius:8px;padding:22px 24px;max-width:70ch}
aside.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;max-height:calc(100vh - 100px);min-width:0}
.stabs{display:flex;gap:2px;background:var(--rule);border-radius:8px;padding:3px;margin-bottom:10px}
.stab{flex:1;border:0;background:transparent;border-radius:6px;padding:7px 6px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.stab.on{background:var(--sheet);color:var(--ink)}
.stab.ai.on{color:var(--ai)}
.spane{overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:10px;min-height:0}
.note{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.note h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:600}
.note p{margin:0 0 8px;font-size:14px}
.note p:last-child{margin-bottom:0}
.note .src{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.note ul{margin:0;padding-left:18px;font-size:14px}
.note li{margin-bottom:4px}
.note.ex{background:var(--paper)}
.note.ex p{font-family:var(--f-display);font-size:15px;line-height:1.75}
.aibox{background:var(--sheet);border:1px solid var(--ai);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.aistatus{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.aistatus i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin-top:6px;display:block}
.aistatus.on i{background:var(--ok)}
.aistatus.off i{background:var(--warn)}
.aistatus a{color:var(--accent)}
.modegrp{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:4px 0 2px}
.modes{display:flex;flex-wrap:wrap;gap:5px}
.mode{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.mode.on{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.aibox textarea,.aibox select{width:100%;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);padding:8px 10px;font-size:14px}
.aidesc{font-size:13px;color:var(--ink);background:var(--ai-soft);border-radius:6px;padding:8px 10px}
details.ctx summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
details.ctx pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:11.5px;background:var(--paper);border-radius:6px;padding:8px;max-height:220px;overflow:auto;margin:6px 0 0}
.aiout{font-size:14px;line-height:1.7;border-top:1px solid var(--rule);padding-top:10px;min-height:20px;overflow-wrap:anywhere}
.aiout h4{font-size:14.5px;margin:10px 0 4px}
.aiout p{margin:0 0 8px}
.aiout ul,.aiout ol{margin:0 0 8px;padding-left:20px}
.aiout table,.rnote table{border-collapse:collapse;font-size:12.5px;margin:6px 0;display:block;overflow-x:auto}
.aiout td,.rnote td{border:1px solid var(--rule);padding:4px 6px;vertical-align:top}
.aiout .thinking{color:var(--muted);font-style:italic}
.aiacts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.aiacts select{width:auto;max-width:180px;padding:4px 6px;font-size:13px}
.caution{font-size:12px;color:var(--muted);border-left:3px solid var(--warn);padding-left:8px;margin:0}
.rnote{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.rnote .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:12.5px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.rnote .hd b{color:var(--ai);font-weight:600}
.rnote .body{font-size:13.5px;line-height:1.65;max-height:220px;overflow:auto}
.rnote .body p{margin:0 0 6px}
.flag{font-family:var(--f-mono);font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);margin-left:6px;vertical-align:1px;font-weight:400}
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);max-width:760px;width:calc(100% - 32px);padding:0}
dialog::backdrop{background:rgba(10,14,22,.5)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet)}
.dlg-h h2{font-family:var(--f-display);font-size:20px;margin:0}
.dlg-b{padding:16px 20px;max-height:70vh;overflow:auto}
.pat{border-bottom:1px solid var(--rule);padding:12px 0}
.pat:last-child{border-bottom:0}
.pat h4{margin:0 0 4px;font-size:15px}
.pat h4 em{font-style:normal;font-family:var(--f-mono);color:var(--accent);margin-right:6px;font-size:13px}
.pat p{margin:0 0 6px;font-size:14px}
.pat blockquote{margin:0;font-family:var(--f-display);font-size:14.5px;background:var(--paper);padding:8px 12px;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:6px 10px;font-size:13px}
@media (max-width:1240px){.layout{grid-template-columns:200px minmax(0,1fr)}aside.side{grid-column:2;position:static;max-height:none}}
@media (max-width:780px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  .phase,.progress{display:none}
  .step{grid-template-columns:24px auto;white-space:nowrap}
  aside.side{grid-column:1}
  main.work{padding:18px 16px 22px}
  .work h2{font-size:23px}
  .rub-item .desc{grid-template-columns:1fr}
}
@media print{header.top,nav.rail,aside.side,.nav-foot,.bar,#confirmZone,.alloc,.checkbox-results,.toast,.todo,.welcome{display:none!important}body{background:#fff;color:#000;padding:0}.layout{display:block;margin:0}main.work{border:0;padding:0;background:#fff}.manuscript{background:#fff;max-width:none;padding:0;font-size:12pt;color:#000}.eyebrow,.lede{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><h1>파이퍼 설교 연구</h1><small>찾고 · 연구하고 · 맛보고 · 쓰고 · 점검한다</small></div>
  <div class="bar">
    <label class="toggle" for="guideToggle"><input type="checkbox" id="guideToggle"> 예시 펼쳐 보기</label>
    <select id="projSel" class="proj" aria-label="설교 선택"></select>
    <button class="btn" id="newBtn">새 설교</button>
    <button class="btn" id="sampleBtn">예시 · 마 13:44</button>
    <button class="btn" id="patBtn">패턴 사전</button>
    <button class="btn" id="backupBtn" title="모든 설교를 JSON 파일로 저장">백업</button>
    <label class="btn" for="restoreIn" style="margin:0">복원</label><input type="file" id="restoreIn" accept=".json,application/json" hidden>

const PATTERNS=[
 ["본문 전문 먼저 게시","설교가 본문의 해설임을 시각적으로 선언한다. 『A Holy Ambition』 모든 장이 본문 전체를 먼저 싣는다.","오늘은 몇 구절만 고르지 않겠습니다. 단락 끝까지 함께 읽고, 설교는 이 본문이 하는 말 이상을 하지 않겠습니다."],

 ["문법·논리 관계 해부","대응표(빌 1:20–21), 뿌리→열매 4단계(엡 1:5–6), 목적 접속사 '~하여'(시 67:1–2), 동사 하나('기억하라').","21절 맨 앞의 '왜냐하면'을 놓치면 이 본문을 놓칩니다."],
 ["어색한 연결 붙잡기","'두려워 말라, 너희가 악을 행했으나'(삼상 12:20)처럼 어긋난 접속에서 복음이 드러난다.","문장이 틀린 것 같지요? 이 틀림이 복음입니다."],

 ["반론 먼저 세우고 답하기","가상 반론, 실제 항의 편지, 반대처럼 보이는 본문(고전 13:5)을 정면으로 다룬다.","'결국 내 행복을 위해 믿으라는 말입니까?' 좋은 질문입니다. 고전 13:3이 답합니다."],
 ["공식 한 단어 바꾸기","소요리문답의 'and'를 'by' 또는 'in'으로. 익숙한 문장이라 변화가 각인된다.","주기도문의 '나라가 임하시오며'를 오늘은 '내게서부터 임하시오며'로 읽어 봅시다."],
 ["대조 쌍","자랑/자기연민, 현미경/망원경, 사자/어린양, '이것 또는 저것'이 아니라 '이것 안의 저것'.","자랑은 '이만큼 이뤘다', 자기연민은 '이만큼 당했다'. 결론은 같습니다. '나를 봐 달라.'"],
 ["일상 비유","입맞춤, '제 기쁨입니다' 하며 계산하는 사업가, 진흙 파이, 퀸 메리호, 붓으로 그리는 화가, 밧줄 붙잡기.","편의점 삼각김밥으로 배를 채우면 어머니 밥상 앞에서 수저가 안 갑니다."],
 ["전기와 자기 고백","선교사 전기는 '모방하라'(히 13:7) 목적으로, 자기 고백은 설교자가 먼저 맛보았다는 증거로 쓴다.","아버지 장례식 날 밤, 이 구절이 처음으로 제게 '말씀'이 되었습니다."],
 ["청중층별 호명","설교 중간에 '어린이 여러분' 단락을 넣고 다시 모든 세대로 넓힌다.","초등학생 친구들, '야망'은 정말정말 하고 싶어서 다른 재미있는 걸 참게 되는 일이에요."],
 ["질문형 적용","'여러분은 그렇게 기도합니까?' 다섯 시험을 다섯 질문으로 바꾼다.","집에 가는 차 안에서 한 질문만 붙드십시오. '지난주 나를 가장 만족시킨 것은 무엇이었나?'"],
 ["하나님 1인칭 의역","본문 근거가 분명할 때만, 의역임을 밝히고 하나님의 음성으로 풀어 말한다(시 67편).","'내가 너희에게 건물과 재정을 준 것은 머물라고가 아니다. 내 길이 땅끝에 알려지게 하려 함이다.'"],

 versions:{label:"번역 비교",desc:"개역개정·새번역·ESV·NASB와 원문 직역을 비교해 갈라지는 곳을 찾습니다.",task:"이 본문을 개역개정, 새번역, ESV, NASB, 원문 직역 관점에서 비교하라. 의미나 뉘앙스가 갈라지는 곳 3–5곳을 표로: 위치 | 번역별 표현 | 원문 | 차이가 생기는 이유 | 설교에서의 함의. 번역문 전체를 길게 옮기지 말고 해당 구절만 짧게 인용하라. 번역문을 정확히 기억하지 못하면 '확인 필요'라고 적어라."},

 redemptive:{label:"구속사 위치",desc:"창조–타락–구속–완성 속 위치와 그리스도로 이어지는 선을 봅니다.",task:"이 본문이 창조–타락–구속–완성의 구속사 흐름 어디에 있는지, 그리고 그리스도와 어떻게 연결되는지 설명하라. 억지 모형론은 피하고, 본문 자체와 신약의 사용에 근거한 연결만 제시하라."},
 theology:{label:"신학 주제",desc:"본문이 보여 주는 하나님과 인간, 연결되는 조직신학 주제를 정리합니다.",task:"이 본문이 보여 주는 (1) 하나님(그리스도)의 속성과 행위 (2) 인간의 상태 (3) 연결되는 조직신학 주제(신론·인간론·기독론·구원론·교회론·종말론 중) (4) 개혁주의 신앙고백(웨스트민스터 등)과의 접점을 정리하라. 각 항목에 본문 근거 절을 달아라."},

 tradition:{label:"교부·청교도·파이퍼",desc:"아우구스티누스, 칼빈, 청교도, 에드워즈, 파이퍼가 이 본문·주제를 다룬 곳을 안내합니다.",task:"아우구스티누스, 칼빈, 청교도(오웬, 백스터, 굿윈 등), 조나단 에드워즈, 존 파이퍼가 이 본문이나 이 본문의 주제를 다룬 저작이나 설교를 안내하라. 확실한 것만 저자·제목으로 적고, 기억이 불확실하면 '확인 필요'라고 표시하라. 인용문을 만들어 내지 말고 요지만 한두 줄로 풀어 써라."},
 tools:{label:"연구 도구 안내",desc:"이 본문 연구에 맞는 원어 사전·문법서·성경 소프트웨어 사용법을 안내합니다.",task:"이 본문을 연구할 때 쓸 원어 사전(예: BDAG, HALOT 등), 문법서, 무료·유료 성경 연구 도구를 안내하고, 이 본문의 핵심 단어 하나를 예로 들어 사전에서 무엇을 확인해야 하는지 단계별로 보여 줘라. 존재가 확실한 자료만 적어라."},

 {phase:"원고",id:"structure",title:"구조 선택",eyebrow:"공정 6 · 설계",

 {phase:"원고",id:"body",title:"대지 원고",eyebrow:"공정 6 · 원고",

  coach:{p:"적용을 의무로 끝내지 않는다. 그 진리가 얼마나 좋은지 감탄하게 한 뒤에 묻는다. 예배가 약한 이유는 사람들이 받으러 와서가 아니라, 설교자가 그들이 굶주린 대상인 하나님을 보여 주지 못해서다.",src:"Dangerous Duty 6장",q:["② 증명에서 청중이 성경을 보고 있게 만드는가?","④ 반론을 일부러 약하게 만들지 않았는가?","⑤ 예화의 주인공이 하나님인가?"],trap:"③ 설명이 길어져 ⑥ 환희·적용이 잘리는 것. 줄일 때는 ③부터 줄인다."},

function target(p){const m=+(p.f.minutes)||35,n=+(p.f.s7_count)||3,peak=+(p.f.s7_peak)||Math.min(2,n);
  const total=Math.max(0,Math.round((m-2)*RATE));
  const intro=Math.round(total*4/33),concl=Math.round(total*3/33),prayer=Math.round(total*1/33);
  const body=total-intro-concl-prayer,base=body/(n+0.125),t={total,intro,concl,prayer};
  for(let i=1;i<=n;i++)t["d"+i]=Math.round(i===peak?base*1.125:base);return t}

const exOf=k=>{const v=SAMPLE[k];if(v==null)return"";return Array.isArray(v)?v.join(" · "):String(v)};

/* ================= 렌더: 레일·프로젝트 ================= */
function stepState(p,i){const s=STEPS[i];if(!s.check)return 0;const r=s.check(p.f,p);const ok=r.filter(x=>x[0]).length;return ok===r.length?2:ok>0?1:0}
function renderRail(){const p=cur(),si=store.step[p.id]||0;let h="",ph="",done=0;
  STEPS.forEach((s,i)=>{if(s.phase!==ph){ph=s.phase;h+=`<div class="phase">${esc(ph)}</div>`}const st=stepState(p,i);if(st===2)done++;
    h+=`<button class="step${i===si?" on":""}" data-go="${i}" aria-current="${i===si?"step":"false"}"><span class="dot ${st===2?"full":st===1?"half":""}">${st===2?"✓":i}</span><span class="t">${esc(s.title)}</span></button>`});
  h+=`<div class="progress">완료 ${done}/${STEPS.length} 공정<div class="meter"><i style="width:${Math.round(done/STEPS.length*100)}%"></i></div></div>`;
  $("#rail").innerHTML=h}
function renderProjects(){$("#projSel").innerHTML=store.order.map(id=>{const p=store.projects[id];const n=(p.f.title||"제목 없음")+(p.f.ref?" · "+p.f.ref:"");return`<option value="${id}"${id===store.current?" selected":""}>${esc(n)}</option>`}).join("")}

/* ================= 렌더: 따라 쓰기 안내 ================= */
function guideHTML(d,isSample){
  const ex=exOf(d.k),showEx=ex&&!isSample;
  if(!d.how&&!d.tpl&&!d.ai&&!d.noai&&!showEx)return"";
  let h=`<div class="guide">`;
  if(d.how)h+=`<div class="how"><b>찾는 법</b>${esc(d.how)}</div>`;
  if(showEx||d.tpl){h+=`<details class="ex"${store.guide?" open":""}><summary>${showEx?"예시 보기 · 마 13:44":"문형 보기"}</summary>`;
    if(showEx)h+=`<div class="exbox">${esc(ex)}</div>`;
    h+=`<div class="exacts">${d.tpl?`<button type="button" class="btn sm" data-tpl="${d.k}">문형으로 시작</button>`:""}${showEx&&d.type!=="checks"&&d.type!=="chips"?`<button type="button" class="btn sm ghost" data-copyex="${d.k}">예시를 칸에 복사</button>`:""}</div></details>`}
  if(d.ai||d.noai)h+=`<div class="airow">${(d.ai||[]).map(m=>`<button type="button" class="aichip" data-ai="${m}" data-aitarget="${d.k}">AI · ${esc(AI[m].label)}</button>`).join("")}${d.noai?`<em class="noai">${esc(d.noai)}</em>`:""}</div>`;
  return h+`</div>`}

function fieldHTML(p,d){const f=p.f,k=d.k,v=f[k],type=d.type,isS=!!p.sample;
  const lab=`<label class="l" for="f_${k}">${esc(d.label)}</label>${d.hint?`<span class="h">${esc(d.hint)}</span>`:""}`;
  const G=guideHTML(d,isS);
  if(type==="text")return`<div class="field">${lab}${G}<input type="text" id="f_${k}" data-k="${k}" value="${esc(v)}"></div>`;
  if(type==="number")return`<div class="field" style="max-width:260px">${lab}<input type="number" id="f_${k}" data-k="${k}" min="10" max="90" value="${esc(v)}"></div>`;
  if(type==="area"||type==="ms")return`<div class="field">${lab}${G}<textarea id="f_${k}" data-k="${k}" rows="${d.rows||3}" class="${type==="ms"?"ms":""}">${esc(v)}</textarea><div class="cnt" data-cnt="${k}">${len(v)}자</div></div>`;
  if(type==="checks"){const arr=v||[];return`<div class="field"><span class="l">${esc(d.label)}</span><div class="checks">${d.opts.map((o,i)=>`<label><input type="checkbox" id="f_${k}_${i}" data-arr="${k}" value="${esc(o)}"${arr.includes(o)?" checked":""}><span>${esc(o)}</span></label>`).join("")}</div></div>`}
  if(type==="chips"){const arr=v||[];return`<div class="field"><span class="l">${esc(d.label)}</span>${G}<div class="chips">${d.opts.map(o=>`<button type="button" class="chip${arr.includes(o)?" on":""}" data-chip="${k}" data-v="${esc(o)}" aria-pressed="${arr.includes(o)}">${esc(o)}</button>`).join("")}</div></div>`}
  if(type==="range")return`<div class="field">${lab}<div style="display:flex;gap:12px;align-items:center"><input type="range" id="f_${k}" data-k="${k}" min="0" max="10" value="${esc(v??5)}" style="flex:1;accent-color:var(--accent)"><span class="cnt" style="margin:0;font-size:16px" data-cnt="${k}">${esc(v??5)}</span></div></div>`;
  if(type==="flow")return`<div class="field">${lab}${G}<div class="chips" style="margin-bottom:8px">${REL.map(r=>`<button type="button" class="chip" data-ins="${k}" data-v=" | ${r}">${r}</button>`).join("")}</div><textarea id="f_${k}" data-k="${k}" rows="${d.rows}" style="font-family:var(--f-mono);font-size:13.5px" placeholder="44a | 천국은 감추인 보화와 같다 | 주명제">${esc(v)}</textarea></div>`;
  if(type==="gs")return`<div class="field">${lab}${G}<textarea id="f_${k}" data-k="${k}" rows="2">${esc(v)}</textarea></div>`;
  return""}

function resultsHTML(p,s){if(!s.check)return"";const r=s.check(p.f,p),w=s.warn?s.warn(p.f,p):[];
  return`<div class="checkbox-results" id="results" aria-live="polite">${r.map(x=>`<div class="res"><span class="pill ${x[0]?"ok":"warn"}">${x[0]?"통과":"보완"}</span><span>${esc(x[0]?x[1]:x[2])}</span></div>`).join("")}${w.map(x=>`<div class="res"><span class="pill bad">주의</span><span>${esc(x)}</span></div>`).join("")}</div>`}
function allocHTML(p,keys){const t=target(p);return`<div class="alloc">${keys.map(k=>`<span>${k[0]} <b>${t[k[1]]}</b>자</span>`).join("")}<span>· 분당 ${RATE}자 기준</span></div>`}

/* ================= 렌더: 구조 ================= */
function structureHTML(p){const f=p.f,n=+f.s7_count||3,isS=!!p.sample;
  let h=`<div class="field"><span class="l">구조 유형</span><div class="guide"><div class="how"><b>찾는 법</b>논리 흐름 공정의 관계를 봅니다. 근거·결과가 이어지면 3대지, 목적절이 겹겹이면 역순, 한 명제를 여러 본문이 증언하면 연대기 행진, 목록형이면 번호 관찰.</div><div class="airow"><button type="button" class="aichip" data-ai="structure">AI · 구조 3안</button></div></div><div class="cards">${STRUCT.map(o=>`<button type="button" class="card${f.s7_type===o[0]?" on":""}" data-card="s7_type" data-v="${o[0]}" aria-pressed="${f.s7_type===o[0]}"><strong>${esc(o[1])}</strong><span>${esc(o[2])}</span></button>`).join("")}</div></div>`;
  h+=`<div class="field" style="max-width:200px"><label class="l" for="f_s7_count">대지 수</label><select id="f_s7_count" data-k="s7_count">${["2","3","4"].map(o=>`<option${String(f.s7_count)===o?" selected":""}>${o}</option>`).join("")}</select></div>`;
  h+=`<div class="field"><span class="l">대지 제목(명사구)과 근거 절</span><div class="guide"><div class="how"><b>찾는 법</b>뼈대 동사(공정 3)마다 하나의 대지를 만듭니다. 제목은 15자 안팎의 명사구, 근거는 반절 단위.</div>${!isS?`<details class="ex"${store.guide?" open":""}><summary>예시 보기 · 마 13:44</summary><div class="exbox">1. ${esc(SAMPLE.d1_title)} (${SAMPLE.d1_ref})\n2. ${esc(SAMPLE.d2_title)} (${SAMPLE.d2_ref}) ← 정점\n3. ${esc(SAMPLE.d3_title)} (${SAMPLE.d3_ref})</div></details>`:""}</div><div class="fields" style="gap:10px">`;
  for(let i=1;i<=n;i++)h+=`<div class="row2"><div class="field"><label class="l" for="f_d${i}_title">대지 ${i}</label><input type="text" id="f_d${i}_title" data-k="d${i}_title" value="${esc(f["d"+i+"_title"])}" placeholder="예: 발견 — 찾아오는 은혜"></div><div class="field"><label class="l" for="f_d${i}_ref">근거 절</label><input type="text" id="f_d${i}_ref" data-k="d${i}_ref" value="${esc(f["d"+i+"_ref"])}" placeholder="예: 44a–b"></div></div>`;
  h+=`</div></div>`;
  const o=[];for(let i=1;i<=n;i++)o.push(String(i));
  h+=`<div class="field" style="max-width:320px"><label class="l" for="f_s7_peak">정점 대지</label><span class="h">어색한 연결이 풀리는 대지. 가장 길게 배분됩니다.</span><select id="f_s7_peak" data-k="s7_peak">${o.map(x=>`<option value="${x}"${String(f.s7_peak)===x?" selected":""}>대지 ${x}${f["d"+x+"_title"]?" · "+esc(f["d"+x+"_title"]):""}</option>`).join("")}</select></div>`;
  return`<div class="fields">${h}</div>`}

function bodyHTML(p){const f=p.f,n=+f.s7_count||3,tab=Math.min(p.bodyTab||1,n),t=target(p),isS=!!p.sample;
  let h=`<div class="tabs" role="tablist">`;for(let i=1;i<=n;i++)h+=`<button class="tab${i===tab?" on":""}" role="tab" aria-selected="${i===tab}" data-tab="${i}">대지 ${i}${+f.s7_peak===i?" · 정점":""}</button>`;h+=`</div>`;
  const tot=[1,2,3,4,5,6].reduce((a,m)=>a+len(f["d"+tab+"_m"+m]),0);
  h+=`<p style="margin:-4px 0 6px;font-family:var(--f-display);font-size:18px">${esc(f["d"+tab+"_title"]||"대지 "+tab+" 제목을 '구조 선택'에서 정하세요")} <span class="flag">${esc(f["d"+tab+"_ref"]||"")}</span></p>`;
  h+=`<div class="alloc"><span>목표 <b>${t["d"+tab]}</b>자</span><span>현재 <b id="bodyTot">${tot}</b>자</span><span>≈ ${(t["d"+tab]/RATE).toFixed(1)}분</span></div>`;
  h+=`<div class="airow" style="margin-bottom:14px"><span class="noai">이 대지 전체:</span><button type="button" class="aichip" data-ai="pointfb">AI · 대지 원고 피드백</button></div><div class="fields">`;

/* ================= 렌더: 검증·완성 ================= */
function analyze(p){const text=manuscript(p,true),t=target(p),L=len(text);
  const god=(text.match(/하나님|주님|그리스도|예수|성령|주께서|주의\s/g)||[]).length,man=(text.match(/우리는|우리가|여러분은|여러분이|나는|제가|저는/g)||[]).length;
  const must=(text.match(/해야\s*합니다|해야\s*한다|하십시오/g)||[]).length,joy=(text.match(/기쁨|기뻐|만족|보화|즐거|감탄|영광/g)||[]).length;
  const verse=(text.match(/\d+\s*절|\d+:\d+/g)||[]).length,q=(text.match(/\?/g)||[]).length;
  const gospel=(text.match(/십자가|부활|은혜|용서|대속|죄 사함|속량|의롭다|그리스도께서|예수께서|피/g)||[]).length;
  return{L,min:L/RATE+2,god,man,must,joy,verse,q,gospel,t}}
function verifyHTML(p){const a=analyze(p),f=p.f,goal=a.t.total;
  const st=(k,v,s,cls)=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s" style="color:var(--${cls})">${s}</div></div>`;

   st("원고 분량",a.L.toLocaleString()+"자",`목표 ${goal.toLocaleString()}자 · ${Math.round(a.L/(goal||1)*100)}%`,Math.abs(a.L-goal)<=goal*.1?"ok":"warn")+
   st("예상 시간",a.min.toFixed(1)+"분",`설교 ${f.minutes||35}분 · 낭독 2분 포함`,Math.abs(a.min-(+f.minutes||35))<=3?"ok":"warn")+
   st("주어 · 하나님:사람",a.god+" : "+a.man,a.man>a.god*2?"하나님 패스 필요":"균형 양호",a.man>a.god*2?"warn":"ok")+
   st("본문 인용 표시",a.verse+"회",a.verse>=5?"본문 종속성 양호":"절 언급을 늘리세요",a.verse>=5?"ok":"warn")+
   st("질문형 문장",a.q+"개",a.q>=3?"질문형 적용 있음":"질문이 적습니다",a.q>=3?"ok":"warn")+
   st("의무 어미 · 기쁨 어휘",a.must+" · "+a.joy,a.must>a.joy?"의무 편중 점검":"영광–만족 결합 양호",a.must>a.joy?"warn":"ok")+
   st("복음 어휘(십자가·부활·은혜…)",a.gospel+"회",a.gospel>=4?"복음이 들립니다":a.gospel?"복음을 더 명시하세요":"복음 어휘가 없습니다 · 도덕 강연 위험",a.gospel>=4?"ok":a.gospel?"warn":"bad")+`</div>`;
  h+=`<div class="field" style="max-width:420px"><label class="l" for="f_v_time">소리 내 읽은 실제 시간(분)</label><span class="h">원고를 끝까지 소리 내 읽고 스톱워치로 잰 시간. 예상치가 아니라 실측값을 적습니다.</span><input type="number" id="f_v_time" data-k="v_time" min="1" max="120" step="0.5" value="${esc(f.v_time)}"></div>`;
  const s=RUBRIC.reduce((x,_,i)=>x+(+f["rb"+i]||0),0);
  h+=`<div class="field"><span class="l">루브릭 자가 채점</span><div class="guide"><div class="how"><b>쓰는 법</b>먼저 스스로 채점합니다. 그다음 AI 루브릭 평가를 받아 내 점수와 2점 이상 차이 나는 항목만 다시 봅니다.</div><div class="airow"><button type="button" class="aichip" data-ai="rubricai">AI · 루브릭 평가(비교용)</button></div></div><div class="rub">`;
  RUBRIC.forEach((r,i)=>{const v=+f["rb"+i]||0;h+=`<div class="rub-item"><div class="hd"><strong>${i+1}. ${r[0]}</strong><div class="scale" role="radiogroup" aria-label="${r[0]} 점수">${[1,2,3,4,5].map(n=>`<button type="button" role="radio" aria-checked="${v===n}" class="${v===n?"on":""}" data-rb="${i}" data-v="${n}">${n}</button>`).join("")}</div></div><div class="desc"><span><b>5</b> ${r[1]}</span><span><b>3</b> ${r[2]}</span><span><b>1</b> ${r[3]}</span></div></div>`});
  h+=`</div></div><div class="total"><span class="v">${s}<span style="font-size:16px;color:var(--muted)">/40</span></span><span class="pill ${s>=32?"ok":"warn"}">${s>=32?"강단 기준 통과":"32점 미만 · 낮은 항목의 공정으로 돌아가세요"}</span></div>`;
  h+=fieldHTML(p,F("v_pass","checks","수정 3패스",{opts:["본문 패스: 모든 주장 옆에 근거 절을 달았다","하나님 패스: '우리/여러분'이 5문장 넘게 이어지는 곳에 하나님 주어 문장을 넣었다","청중 패스: 소리 내 읽고 시간을 쟀다. 넘치면 ③설명부터 줄였다"]}));
  h+=fieldHTML(p,F("v_pastoral","checks","목회적 점검 4문",{opts:["고난 중인 성도가 들어도 상처가 아니라 위로가 되도록 섭리를 말했다('하나님이 하셨다'보다 '하나님이 다스리신다'로 시작)","회개의 부름과 은혜의 초청이 둘 다 있다 — 명령 뒤에 은혜가 따라온다","자랑하는 사람과 자기연민에 빠진 사람 둘 다에게 말을 건다","적용이 교회 프로그램·헌금·출석 홍보로 흐르지 않는다"]}));
  h+=fieldHTML(p,F("v_five","checks","강단에 오르기 전 5문 · 고후 2:17",{opts:["이 설교로 칭찬이 아니라 그리스도를 얻으려 한다","내가 믿지 않거나 맛보지 않은 문장이 원고에 없다","이 메시지는 내 의견을 성경으로 포장한 것이 아니다","사람의 평가보다 하나님의 평가를 두려워한다","확신과 용기를 그리스도와의 연합에서 얻는다"]}));
  return`<div class="fields">${h}</div>`}
function manuscript(p,plain){const f=p.f,n=+f.s7_count||3,P=[],add=s=>{if(s&&String(s).trim())P.push(String(s).trim())};
  if(!plain){add(f.title?"『"+f.title+"』":"");add(f.ref?"본문: "+f.ref:"");add(f.passage);add("— 서론 —")}
  add(f.i1);add(f.i2);add(f.i3);add(f.i4);
  for(let i=1;i<=n;i++){if(!plain)add(`— ${i}. ${f["d"+i+"_title"]||"대지 "+i}${f["d"+i+"_ref"]?" ("+f["d"+i+"_ref"]+")":""} —`);for(let m=1;m<=6;m++)add(f["d"+i+"_m"+m])}
  if(!plain)add("— 결론 —");add(f.s10_concl);
  const q=lines(f.s10_q);if(q.length)add(q.join("\n"));add(f.s10_last);add(f.s10_grace);
  if(!plain)add("— 기도 —");add(f.s10_prayer);
  return P.join("\n\n")}
function manuscriptLen(p){return len(manuscript(p,true))}
function outline(p){const f=p.f,n=+f.s7_count||3,L=[];L.push((f.title||"제목 없음")+" · "+(f.ref||""));L.push("핵심 명제: "+(f.s5_prop||""));L.push("영광–만족: "+(f.s5_gs||""));L.push("어색한 연결: "+(f.s3_odd||""));L.push("구조: "+((STRUCT.find(s=>s[0]===f.s7_type)||[])[1]||""));for(let i=1;i<=n;i++)L.push(`${i}. ${f["d"+i+"_title"]||""} (${f["d"+i+"_ref"]||""})${+f.s7_peak===i?" ← 정점":""}`);L.push("적용 질문:\n"+(f.s10_q||""));return L.join("\n")}
function finalHTML(p){const t=manuscript(p,false),a=analyze(p);
  return`<div class="alloc"><span>본문 제외 원고 <b>${a.L.toLocaleString()}</b>자</span><span>예상 <b>${a.min.toFixed(1)}</b>분</span></div><div class="bar" style="margin-bottom:14px"><button class="btn primary" id="copyBtn">원고 복사</button><button class="btn" id="copyOutline">개요만 복사</button><button class="btn" id="copyNotes">연구 노트 복사</button><button class="btn" id="dlTxt">원고 .txt 저장</button><button class="btn" id="printBtn">인쇄 · PDF</button></div><div class="manuscript" id="msOut" tabindex="0">${esc(t)||'<span style="color:var(--muted)">아직 원고 칸이 비어 있습니다. 서론 4동작부터 채우세요.</span>'}</div>`}

  add("단락 경계",'s1_bound');add("문맥 메모",'s1_context');add("관찰 · 동사",'s2_verbs');add("관찰 · 접속사",'s2_conj');

function buildPrompt(mode,extra){const M=AI[mode];const task=mode==="free"?(extra||"(질문을 입력하세요)"):M.task+(extra?"\n추가 요청: "+extra:"");

function inline(s){return s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>")}
function md(t){const s=esc(t),rows=s.split("\n"),out=[];let inList=null,inTable=false;
  const close=()=>{if(inList){out.push(inList==="ul"?"</ul>":"</ol>");inList=null}if(inTable){out.push("</table>");inTable=false}};
  for(const r of rows){const line=r.trimEnd();let m;
    if(/^\s*\|.*\|\s*$/.test(line)){if(/^\s*\|[\s:\-|]+\|\s*$/.test(line))continue;if(!inTable){close();out.push("<table>");inTable=true}out.push("<tr>"+line.trim().slice(1,-1).split("|").map(c=>"<td>"+inline(c.trim())+"</td>").join("")+"</tr>");continue}
    if(inTable){out.push("</table>");inTable=false}
    if((m=line.match(/^#{1,4}\s+(.*)/))){close();out.push("<h4>"+inline(m[1])+"</h4>");continue}
    if((m=line.match(/^\s*[-*•]\s+(.*)/))){if(inList!=="ul"){close();out.push("<ul>");inList="ul"}out.push("<li>"+inline(m[1])+"</li>");continue}
    if((m=line.match(/^\s*\d+[.)]\s+(.*)/))){if(inList!=="ol"){close();out.push("<ol>");inList="ol"}out.push("<li>"+inline(m[1])+"</li>");continue}
    if(!line.trim()){close();continue}
    close();out.push("<p>"+inline(line)+"</p>")}
  close();return out.join("")}

function openAI(mode,target){store.side="ai";aiState.mode=mode;aiState.target=target||"";aiState.out="";aiState.extra="";save();renderSide();

async function runAI(){if(!sampleFn||aiState.busy||!aiState.mode)return;const mode=aiState.mode;const prompt=buildPrompt(mode,aiState.extra);

  catch(e){const c=e&&e.code;aiState.out=(e&&e.text)||"";
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){aiBlocked=true;toast("AI 사용이 허용되지 않았습니다. 프롬프트 복사를 이용하세요")}
    else if(c==="rate_limited")toast("요청이 많습니다. 잠시 뒤 다시 눌러 주세요");

    else if(c==="prompt_too_large")toast("자료가 너무 깁니다. 원고 일부로 다시 시도하세요");
    else if(c==="session_expired")toast("Claude에 다시 로그인해 주세요");
    else if(c!=="cancelled")toast("연결이 끊겼습니다. 다시 눌러 주세요")}

function download(name,text,type){const blob=new Blob([text],{type:type+";charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast(name+" 저장")}
let tT;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2800)}

$("#newBtn").onclick=()=>{newProject();aiState.out="";renderAll();toast("새 설교를 시작했습니다. 공정 0부터 따라오세요")};
$("#sampleBtn").onclick=()=>{const ex=store.order.find(id=>store.projects[id].sample);if(ex)store.current=ex;else{const id=newProject(JSON.parse(JSON.stringify(SAMPLE)));store.projects[id].sample=true}aiState.out="";save();renderAll();toast("마 13:44 예시를 열었습니다 · 원고는 골격 분량입니다")};
$("#delBtn").onclick=()=>{const p=cur();$("#confirmZone").innerHTML=`<div class="confirm" style="margin-top:10px"><span>'${esc(p.f.title||"제목 없음")}'을(를) 삭제할까요? 되돌릴 수 없습니다.</span><button class="btn sm" id="delYes">삭제</button><button class="btn sm" id="delNo">취소</button></div>`;
  $("#delNo").onclick=()=>$("#confirmZone").innerHTML="";
  $("#delYes").onclick=()=>{delete store.projects[p.id];store.order=store.order.filter(x=>x!==p.id);if(!store.order.length)newProject();store.current=store.order[0];save();$("#confirmZone").innerHTML="";renderAll();toast("삭제했습니다")}};
$("#patBtn").onclick=()=>{$("#patBody").innerHTML=PATTERNS.map((x,i)=>`<div class="pat"><h4><em>${String(i+1).padStart(2,"0")}</em>${esc(x[0])}</h4><p>${esc(x[1])}</p><blockquote>${esc(x[2])}</blockquote></div>`).join("")+`<p style="font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:12px">원리 설명은 존 파이퍼 저서 6권에서 추출해 풀어 쓴 것이고, 인용 블록의 예문은 모두 창작입니다.</p>`;$("#patDlg").showModal()};
$("#backupBtn").onclick=()=>{const d=new Date(),ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");download("파이퍼설교연구_백업_"+ds+".json",JSON.stringify(store,null,1),"application/json")};
$("#restoreIn").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.projects||!s.order)throw 0;let n=0;s.order.forEach(id=>{if(s.projects[id]){let nid=id;if(store.projects[nid])nid=uid();store.projects[nid]=Object.assign(s.projects[id],{id:nid});if(!store.projects[nid].notes)store.projects[nid].notes=[];store.order.unshift(nid);store.step[nid]=(s.step&&s.step[id])||0;n++}});store.current=store.order[0];save();renderAll();toast(n+"편을 복원했습니다")}catch(err){toast("백업 파일 형식이 아닙니다. 이 프로그램에서 만든 .json 파일을 고르세요")}e.target.value=""};r.readAsText(file,"utf-8")};
$("#patClose").onclick=()=>$("#patDlg").close();

/* ================= 시작 ================= */
load();
if(!store.order.length){const sid=newProject(JSON.parse(JSON.stringify(SAMPLE)));store.projects[sid].sample=true;const id=newProject();store.current=id;save()}
if(!store.projects[store.current])store.current=store.order[0];
store.order.forEach(id=>{if(!store.projects[id].notes)store.projects[id].notes=[]});
if(!["coach","ai","notes"].includes(store.side))store.side="coach";
$("#guideToggle").checked=store.guide!==false;
renderAll();
(async()=>{try{if(window.claude&&typeof window.claude.use==="function")sampleFn=await window.claude.use("sample");else sampleFn=null}catch(e){sampleFn=null}if(store.side==="ai")renderAI()})();
})();
</script>
</body>
</html>
